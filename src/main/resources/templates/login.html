<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar</title>

  <!-- Bootstrap 5.3.3 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../static/css/style_login.css">
</head>
<body>

  <main class="login-page d-flex align-items-center justify-content-center min-vh-100 px-3">
    <div class="login-wrapper w-100">

      <h1 class="h3 fw-bold mb-1">Entrar</h1>
      <p class="text-secondary mb-4">Use seu e-mail e senha para acessar.</p>

      <form id="loginForm" th:action="@{/login}" method="post">
        <div class="mb-3">
          <label for="email" class="form-label">E-mail</label>
          <input type="email" class="form-control" id="email" name="email"
                 placeholder="voce@exemplo.com" autocomplete="email" required>
          <div class="invalid-feedback">Informe um e-mail válido.</div>
        </div>

        <div class="mb-4">
          <label for="senha" class="form-label">Senha</label>
          <input type="password" class="form-control" id="senha" name="senha"
                 placeholder="Sua senha" autocomplete="current-password" required minlength="6">
          <div class="invalid-feedback">A senha deve ter pelo menos 6 caracteres.</div>
        </div>

        <button type="submit" class="btn btn-dark-custom w-100">Entrar</button>
          <p id="mensagem"></p>
      </form>

    </div>
  </main>

  <script src="../static/js/login.js">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Validação simples no cliente. Troque pelo envio real para sua API.
    const form = document.getElementById('login-form');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      form.classList.add('was-validated');
      if (!form.checkValidity()) return;

      const dados = {
        email: form.email.value.trim(),
        senha: form.senha.value
      };
      console.log('Login enviado:', dados);
      // fetch('/api/login', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(dados) })
    });
  </script>
</body>
</html>
