<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body style="background-image:url(img/images\ \(2\).jpg)">
    <header>
        <h1 style="font-size: 50px; align-items: center; text-align: center; width: 100%; height: 100%; color: white;">PARABÉNS, VOCE É UM ADMIN!!!</h1>
    </header>
    <main class="dashboard">

        <h1 style="color: white;">Painel Administrativo</h1>

        <p style="color: white;">Bem-vindo ao sistema de gerenciamento!</p>

        <section class="dashboard-card">

            <h2 style="color: white;">Gerenciamento de usuários</h2>

            <p style="color: white;">
                Aqui o administrador poderá visualizar
                e gerenciar os usuários cadastrados.
            </p>

            <button id="listarUsuarios">
                Listar usuários
            </button>

        </section>

        <section class="dashboard-card">

            <h2 style="color: white;">Gerenciamento de permissões</h2>

            <p style="color: white;">
                Aqui será possível alterar os níveis
                de acesso dos usuários.
            </p>

        </section>

        <button id="logoutButton">
            Sair do sistema
        </button>

    </main>

    <script src="/js/admin.js"></script>
</body>
</html>
